[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "tieredq"
version = "0.1.0"
description = "Trained exhaustive in-memory vector index with variance-aware bit allocation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/SeanPedersen/TieredQ"
Issues = "https://github.com/SeanPedersen/TieredQ/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/tieredq"]
build-dir = "build/{wheel_tag}"
install.components = ["python"]
sdist.exclude = ["benchmark/**", "dist/**", ".github/**", "uv.lock"]

[tool.scikit-build.cmake.define]
TIEREDQ_TESTS = "OFF"
TIEREDQ_EXAMPLES = "OFF"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win* *-manylinux_i686"
test-requires = ["pytest>=8"]
test-command = "python -m pytest {project}/tests/python -q"
environment = { OMP_NUM_THREADS = "2", OPENBLAS_NUM_THREADS = "1", CMAKE_BUILD_PARALLEL_LEVEL = "3" }

[tool.cibuildwheel.config-settings]
"cmake.define.TIEREDQ_URING" = "OFF"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y openblas-devel"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "CMakeLists.txt"}, {file = "cmake/*"}, {file = "bindings/*"}, {file = "src/**"}, {file = "include/**"}, {file = "python/**"}]
