[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "tieredq"
version = "0.1.0"
description = "Trained exhaustive in-memory vector index with variance-aware bit allocation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/tieredq"]
build-dir = "build/{wheel_tag}"
install.components = ["python"]

[tool.scikit-build.cmake.define]
TIEREDQ_TESTS = "OFF"
TIEREDQ_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "CMakeLists.txt"}, {file = "cmake/*"}, {file = "bindings/*"}, {file = "src/**"}, {file = "include/**"}, {file = "python/**"}]
