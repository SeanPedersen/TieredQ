[project]
name = "knn-graph-study"
version = "0.1.0"
description = "Issue #56: all-points k-NN graph builders (IVF cluster-join vs HNSW vs NN-descent)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "faiss-cpu==1.15.1", "hnswlib", "pynndescent", "threadpoolctl", "tieredq", "rinnd==0.4.4",
                "manifolds-rs==0.7.0", "torch", "s-means"]

[tool.uv.sources]
tieredq = { path = "tieredq" }
torch = { index = "pytorch-cpu" }
s-means = { git = "https://github.com/suayptalha/s-means", rev = "83c20d09621bf8be2b7ca896359d17c1cca54f0c" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
