[package]
name = "qdrant_bench"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
quantization = { path = "../qdrant/lib/quantization", features = ["testing"] }
common = { path = "../qdrant/lib/common/common" }
serde_json = "1"
rayon = "1"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
